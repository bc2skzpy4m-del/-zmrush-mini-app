<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZMRush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding-bottom:30px}
.hero{position:relative;overflow:hidden;border-radius:0 0 24px 24px;background:#111}
.hero img{display:block;width:100%;height:auto;max-height:62vh;object-fit:cover;object-position:center}
.overlay{position:absolute;inset:auto 0 0;padding:55px 18px 20px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.logo{font-size:27px;font-weight:900;letter-spacing:1px}.logo span{color:#e31b23}
.sub{margin-top:4px;color:#c7c7c7;font-size:12px;letter-spacing:1.5px}
.content{padding:18px 16px}.server{border:1px solid #292929;background:#111;border-radius:18px;padding:16px}
.label{font-size:11px;color:#a6a6a6;text-transform:uppercase;letter-spacing:1.2px}.ip{font-size:21px;font-weight:800;margin:7px 0}.online{color:#73e27b;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{border:0;border-radius:13px;padding:14px 10px;font-size:14px;font-weight:800;color:#fff;background:#d71920}
button.secondary{background:#1b1b1b;border:1px solid #333}
h2{font-size:20px;margin:26px 2px 12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border:1px solid #292929;border-radius:17px;padding:15px}.card h3{margin:0 0 7px;font-size:17px}.card p{margin:0;color:#aaa;font-size:12px;line-height:1.4}.more{margin-top:12px;width:100%;background:#1b1b1b;border:1px solid #333;padding:10px}
@media(max-width:370px){.cards,.actions{grid-template-columns:1fr}.hero img{max-height:55vh}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
<img src="zmrush.jpg" alt="ZMRush">
<div class="overlay"><div class="logo">ZM<span>Rush</span></div><div class="sub">ZOMBIE MOD • RUSH • DEADLY • NO MERCY</div></div>
</section>
<main class="content">
<section class="server">
<div class="label">Игровой сервер</div>
<div class="ip">46.174.49.59:27219</div>
<div class="online">● ZMRush Zombie Mod</div>
<div class="actions">
<button onclick="copyIP()">СКОПИРОВАТЬ IP</button>
<button class="secondary" onclick="openPrivileges()">ПРИВИЛЕГИИ</button>
</div>
</section>
<h2>Привилегии</h2>
<div class="cards">
<div class="card"><h3>⭐ VIP</h3><p>Основные преимущества привилегии.</p><button class="more" onclick="info('VIP')">Подробнее</button></div>
<div class="card"><h3>🔥 VIP+</h3><p>Расширенные возможности игрока.</p><button class="more" onclick="info('VIP+')">Подробнее</button></div>
<div class="card"><h3>⚡ ADMIN</h3><p>Административные возможности.</p><button class="more" onclick="info('ADMIN')">Подробнее</button></div>
<div class="card"><h3>👑 ULTIMATE</h3><p>Максимальный набор возможностей.</p><button class="more" onclick="info('ULTIMATE')">Подробнее</button></div>
</div>
</main>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
function copyIP(){navigator.clipboard?.writeText('46.174.49.59:27219');tg?.showAlert?.('IP скопирован')}
function openPrivileges(){document.querySelector('h2')?.scrollIntoView({behavior:'smooth'})}
function info(x){tg?.showAlert?.('Здесь будет подробное описание '+x+'.')}
</script>
</body>
</html>
